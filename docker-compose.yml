services:
  mysql:
    image: mysql:8.0
    container_name: school-event-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: school123
      MYSQL_DATABASE: event_registration
      TZ: Europe/Kyiv
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pschool123"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
